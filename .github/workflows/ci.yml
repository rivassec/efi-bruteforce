name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (efi_range_tracker.sh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Scope to error severity: this is a legacy PoC helper script; -S error
      # gates on genuine breakage (parse/syntax) without failing on style noise.
      - name: Run shellcheck (error severity)
        run: shellcheck -S error efi_range_tracker.sh

  arduino-lint:
    name: arduino-lint (sketches)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The two Teensy USB-HID sketches live at the repo root. A valid Arduino
      # sketch must sit in a folder whose name matches its .ino, so stage each
      # into its own folder before linting (else arduino-lint reports SS001).
      - name: Stage sketches into matching folders
        run: |
          mkdir -p staging/efi_attack staging/icloud_attack
          cp efi_attack.ino staging/efi_attack/efi_attack.ino
          cp icloud_attack.ino staging/icloud_attack/icloud_attack.ino

      - name: Lint Arduino sketches
        uses: arduino/arduino-lint-action@9a3603836c75e41753e531167395edeb90ba5dae # v3.0.0
        with:
          path: ./staging
          recursive: true
          project-type: sketch
          compliance: specification
